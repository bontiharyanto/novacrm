# Laptop production-like stack. Not for VPS.
# Browser talks to Supabase/MinIO on 127.0.0.1; containers use host.docker.internal / compose DNS.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      NOVACRM_SUPABASE_URL: http://127.0.0.1:54321
      NOVACRM_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_INTERNAL_URL: http://host.docker.internal:54321
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      SMTP_HOST: host.docker.internal
      SMTP_PORT: '54325'
    ports:
      - '3000:3000'
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run worker
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      NOVACRM_SUPABASE_URL: http://127.0.0.1:54321
      NOVACRM_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_INTERNAL_URL: http://host.docker.internal:54321
      REDIS_URL: redis://redis:6379
      SMTP_HOST: host.docker.internal
      SMTP_PORT: '54325'
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 4;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/novacrm || true;
      exit 0;
      "

volumes:
  minio_data:
  redis_data:
