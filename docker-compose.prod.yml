version: '3.9'

services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-ops@novacrm.app}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    restart: unless-stopped

  web:
    image: ghcr.io/bontiharyanto/novacrm:${IMAGE_TAG:-latest}
    platform: linux/amd64
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    labels:
      - traefik.enable=true
      - traefik.http.routers.novacrm.rule=Host(`${APP_HOST:-novacrm.local}`)
      - traefik.http.routers.novacrm.entrypoints=websecure
      - traefik.http.routers.novacrm.tls.certresolver=le
      - traefik.http.services.novacrm.loadbalancer.server.port=3000
      - traefik.http.services.novacrm.loadbalancer.healthcheck.path=/api/health
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        order: start-first
    restart: unless-stopped

  worker:
    image: ghcr.io/bontiharyanto/novacrm:${IMAGE_TAG:-latest}
    command: npm run worker
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      sleep 4;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/novacrm || true;
      exit 0;
      "

  backup:
    image: postgres:16-alpine
    depends_on:
      - minio
    env_file:
      - .env.production
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./scripts:/scripts:ro
      - backup_data:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl ca-certificates tzdata >/dev/null
        echo "0 2 * * * /scripts/backup.sh >> /backups/backup.log 2>&1" > /etc/crontabs/root
        crond -f -l 8
    restart: unless-stopped

volumes:
  traefik_letsencrypt:
  redis_data:
  minio_data:
  backup_data:
