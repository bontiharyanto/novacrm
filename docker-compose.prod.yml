services:
  traefik:
    image: traefik:v3.6.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-ops@novacrm.app}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    restart: unless-stopped

  web:
    image: ghcr.io/bontiharyanto/novacrm:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: https://${MINIO_PUBLIC_HOST:-files.novacrm.local}
      APP_URL: https://${APP_HOST:-novacrm.local}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.http.routers.novacrm.rule=Host(`${APP_HOST:-novacrm.local}`)
      - traefik.http.routers.novacrm.entrypoints=websecure
      - traefik.http.routers.novacrm.tls.certresolver=le
      - traefik.http.services.novacrm.loadbalancer.server.port=3000
      - traefik.http.services.novacrm.loadbalancer.healthcheck.path=/api/health
    restart: unless-stopped

  worker:
    image: ghcr.io/bontiharyanto/novacrm:${IMAGE_TAG:-latest}
    command: npm run worker
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      APP_URL: https://${APP_HOST:-novacrm.local}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    env_file:
      - .env.production
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change-me-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-secret}
    volumes:
      - minio_data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio-s3.rule=Host(`${MINIO_PUBLIC_HOST:-files.novacrm.local}`)
      - traefik.http.routers.minio-s3.entrypoints=websecure
      - traefik.http.routers.minio-s3.tls.certresolver=le
      - traefik.http.routers.minio-s3.service=minio-s3
      - traefik.http.services.minio-s3.loadbalancer.server.port=9000
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change-me-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-novacrm}
      APP_HOST: ${APP_HOST:-novacrm.local}
    volumes:
      - ./scripts/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]

  backup:
    image: postgres:17-alpine
    depends_on:
      - minio
    env_file:
      - .env.production
    environment:
      TZ: Asia/Jakarta
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./scripts:/scripts:ro
      - backup_data:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache tzdata >/dev/null
        printf '%s\n' 'PATH=/usr/local/bin:/usr/bin:/bin' 'TZ=Asia/Jakarta' '0 2 * * * /scripts/cron-backup.sh >> /backups/backup.log 2>&1' > /etc/crontabs/root
        exec crond -f -l 8
    restart: unless-stopped

volumes:
  traefik_letsencrypt:
  redis_data:
  minio_data:
  backup_data:
